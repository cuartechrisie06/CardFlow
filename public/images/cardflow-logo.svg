<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8956c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c9a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8956c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c9a0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B4513" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Card stack icon — 3 overlapping photocard shapes -->
  <!-- Back card -->
  <rect x="8" y="18" width="38" height="52" rx="6" ry="6"
        fill="url(#cardGrad3)"
        stroke="#d4b896" stroke-width="1"
        transform="rotate(-8, 27, 44)"
        filter="url(#shadow)"/>

  <!-- Middle card -->
  <rect x="14" y="14" width="38" height="52" rx="6" ry="6"
        fill="url(#cardGrad2)"
        stroke="#c8956c" stroke-width="1"
        transform="rotate(-2, 33, 40)"
        filter="url(#shadow)"/>

  <!-- Front card -->
  <rect x="20" y="12" width="38" height="52" rx="6" ry="6"
        fill="url(#cardGrad1)"
        filter="url(#shadow)"/>

  <!-- Star detail on front card -->
  <text x="39" y="42" font-size="14" text-anchor="middle"
        fill="rgba(255,255,255,0.6)" font-family="serif">✦</text>

  <!-- Wordmark -->
  <!-- "Card" -->
  <text x="76" y="52"
        font-family="Georgia, 'Playfair Display', serif"
        font-size="32"
        font-weight="700"
        fill="#3d2b1f"
        letter-spacing="-0.5">Card</text>

  <!-- "Flow" in warm brown -->
  <text x="149" y="52"
        font-family="Georgia, 'Playfair Display', serif"
        font-size="32"
        font-weight="400"
        fill="#8B4513"
        letter-spacing="-0.5">Flow</text>

  <!-- Tagline -->
  <text x="76" y="68"
        font-family="'DM Sans', Helvetica, sans-serif"
        font-size="9"
        font-weight="400"
        fill="#b09070"
        letter-spacing="2.5">PHOTOCARD TRADING PLATFORM</text>

  <!-- Decorative dot between Card and Flow -->
  <circle cx="145" cy="46" r="2.5" fill="#c8956c"/>
</svg>
